name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Start PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-client-16 postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql --set=ON_ERROR_STOP=1 --command "CREATE ROLE qas_test LOGIN PASSWORD 'qas_test_password';"
          sudo -u postgres createdb --owner=qas_test organizacao_recursos_test
          pg_isready --host=127.0.0.1 --port=5432 --username=qas_test --dbname=organizacao_recursos_test --timeout=30

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification, JaCoCo gate and reports
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/organizacao_recursos_test
          TEST_DB_USERNAME: qas_test
          TEST_DB_PASSWORD: qas_test_password
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Analyze with SonarCloud when configured
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_ORGANIZATION:-}" ] || [ -z "${SONAR_PROJECT_KEY:-}" ]; then
            echo "::notice::SonarCloud não executado: configure SONAR_TOKEN e as variáveis SONAR_ORGANIZATION e SONAR_PROJECT_KEY no repositório."
            exit 0
          fi

          ./mvnw --batch-mode --no-transfer-progress sonar:sonar \
            "-Dsonar.organization=${SONAR_ORGANIZATION}" \
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  supabase-connection:
    name: supabase-connection
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Supabase connection with a read-only query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not configured in repository secrets."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          let connection;
          let database;
          let username;
          let password;
          try {
            connection = new URL(process.env.SUPABASE_DB_URL);
            if (!['postgres:', 'postgresql:'].includes(connection.protocol)) {
              throw new Error('Unsupported protocol');
            }
            database = decodeURIComponent(connection.pathname.slice(1));
            username = decodeURIComponent(connection.username);
            password = decodeURIComponent(connection.password);
            if (!connection.hostname || !database || !username || !password) {
              throw new Error('Incomplete connection URL');
            }
          } catch {
            console.error('SUPABASE_DB_URL must be a valid PostgreSQL connection URL.');
            process.exit(1);
          }

          const environment = { ...process.env };
          delete environment.SUPABASE_DB_URL;
          environment.PGHOST = connection.hostname;
          environment.PGPORT = connection.port || '5432';
          environment.PGDATABASE = database;
          environment.PGUSER = username;
          environment.PGPASSWORD = password;
          environment.PGSSLMODE = 'require';
          environment.PGOPTIONS = '-c default_transaction_read_only=on -c statement_timeout=15000';
          environment.PGCONNECT_TIMEOUT = '10';
          environment.PGAPPNAME = 'qas-ci-supabase-readonly';

          const result = spawnSync(
            'psql',
            [
              '--no-psqlrc',
              '--no-password',
              '--quiet',
              '--set=ON_ERROR_STOP=1',
              '--tuples-only',
              '--no-align',
              '--command',
              'BEGIN TRANSACTION READ ONLY; SELECT 1; ROLLBACK;',
            ],
            { env: environment, encoding: 'utf8', timeout: 30000 },
          );

          if (result.error || result.status !== 0 || result.stdout.trim() !== '1') {
            console.error('Supabase read-only connectivity check failed.');
            process.exit(1);
          }

          console.log('Supabase read-only connectivity check succeeded (SELECT 1).');
          NODE
