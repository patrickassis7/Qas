name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification, JaCoCo gate and reports
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Analyze with SonarCloud when configured
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_ORGANIZATION:-}" ] || [ -z "${SONAR_PROJECT_KEY:-}" ]; then
            echo "::notice::SonarCloud não executado: configure SONAR_TOKEN e as variáveis SONAR_ORGANIZATION e SONAR_PROJECT_KEY no repositório."
            exit 0
          fi

          ./mvnw --batch-mode --no-transfer-progress sonar:sonar \
            "-Dsonar.organization=${SONAR_ORGANIZATION}" \
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
